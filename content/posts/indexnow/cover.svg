<svg width="1050" height="480" viewBox="0 0 1050 480" role="img" xmlns="http://www.w3.org/2000/svg">
<title>IndexNow для статического блога</title>
<desc>Один git push дёргает один запрос IndexNow, который веером расходится ко всем поисковикам протокола; Google остаётся в стороне на sitemap.</desc>
<defs>
<linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#24273a"/><stop offset="100%" stop-color="#1e2030"/>
</linearGradient>
<linearGradient id="hubGrad" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#8fcdea"/><stop offset="100%" stop-color="#7dc4e4"/>
</linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#7dc4e4"/>
</marker>
</defs>

<!-- база: прямые края, весь холст, без rx -->
<rect x="0" y="0" width="1050" height="480" fill="url(#bgGrad)"/>

<!-- тихая структурная сетка -->
<g stroke="#494d64" stroke-width="0.5" opacity="0.35">
  <line x1="0" y1="128" x2="1050" y2="128"/>
  <line x1="0" y1="408" x2="1050" y2="408"/>
  <line x1="330" y1="110" x2="330" y2="440"/>
  <line x1="760" y1="110" x2="760" y2="440"/>
</g>

<!-- Заголовок -->
<text x="525" y="58" text-anchor="middle" font-family="'PT Sans', sans-serif"
      font-size="30" font-weight="700" fill="#cad3f5">IndexNow для статического блога</text>
<text x="525" y="89" text-anchor="middle" font-family="'PT Sans', sans-serif"
      font-size="15" fill="#a5adcb">один push — и один запрос уходит сразу во все поисковики</text>

<!-- ВЕЕР: хаб → поисковики (пропагация, приглушённый сапфир) -->
<g stroke="#7dc4e4" stroke-width="1.8" opacity="0.4" fill="none">
  <line x1="540" y1="265" x2="836" y2="105"/>
  <line x1="540" y1="265" x2="836" y2="185"/>
  <line x1="540" y1="265" x2="836" y2="265"/>
  <line x1="540" y1="265" x2="836" y2="345"/>
  <line x1="540" y1="265" x2="836" y2="425"/>
</g>
<g fill="#7dc4e4" opacity="0.55">
  <circle cx="836" cy="105" r="3"/><circle cx="836" cy="185" r="3"/>
  <circle cx="836" cy="265" r="3"/><circle cx="836" cy="345" r="3"/>
  <circle cx="836" cy="425" r="3"/>
</g>

<!-- поисковики-участники: нейтральные боксы -->
<g font-family="'JetBrains Mono', monospace" font-size="13" fill="#cad3f5" text-anchor="middle">
  <rect x="840" y="84"  width="150" height="42" rx="6" fill="#363a4f" stroke="#494d64"/>
  <text x="915" y="109">Bing</text>
  <rect x="840" y="164" width="150" height="42" rx="6" fill="#363a4f" stroke="#494d64"/>
  <text x="915" y="189">Yandex</text>
  <rect x="840" y="244" width="150" height="42" rx="6" fill="#363a4f" stroke="#494d64"/>
  <text x="915" y="269">Naver</text>
  <rect x="840" y="324" width="150" height="42" rx="6" fill="#363a4f" stroke="#494d64"/>
  <text x="915" y="349">Seznam</text>
  <rect x="840" y="404" width="150" height="42" rx="6" fill="#363a4f" stroke="#494d64"/>
  <text x="915" y="429">Yep</text>
</g>

<!-- git push → хаб: сапфировая стрелка (сам submit) -->
<line x1="248" y1="265" x2="344" y2="265" stroke="#7dc4e4" stroke-width="2.5" marker-end="url(#arrow)"/>

<!-- узел источника -->
<rect x="58" y="237" width="190" height="56" rx="8" fill="#363a4f" stroke="#494d64"/>
<text x="153" y="261" text-anchor="middle" font-family="'JetBrains Mono', monospace"
      font-size="15" fill="#cad3f5">git push</text>
<text x="153" y="281" text-anchor="middle" font-family="'JetBrains Mono', monospace"
      font-size="10.5" fill="#a5adcb">content/*.md</text>

<!-- СМЫСЛОВОЙ ЦЕНТР: единственный сапфировый очаг (#7dc4e4) -->
<rect x="350" y="221" width="192" height="88" rx="12" fill="#0b7285"/>
<rect x="356" y="227" width="180" height="76" rx="10" fill="url(#hubGrad)" stroke="#0b7285" stroke-width="1.5"/>
<text x="446" y="259" text-anchor="middle" font-family="'JetBrains Mono', monospace"
      font-size="18" font-weight="700" fill="#1e2030">IndexNow</text>
<text x="446" y="282" text-anchor="middle" font-family="'JetBrains Mono', monospace"
      font-size="11.5" fill="#24273a">один запрос → всем</text>

<!-- Google вне протокола: пунктирный узел, отдельный путь -->
<line x1="153" y1="293" x2="153" y2="374" stroke="#a5adcb" stroke-width="1.5"
      stroke-dasharray="4 4" opacity="0.5"/>
<rect x="58" y="376" width="210" height="52" rx="8" fill="#363a4f" stroke="#a5adcb"
      stroke-dasharray="5 4" opacity="0.85"/>
<text x="163" y="398" text-anchor="middle" font-family="'JetBrains Mono', monospace"
      font-size="13" fill="#a5adcb">Google</text>
<text x="163" y="416" text-anchor="middle" font-family="'PT Sans', sans-serif"
      font-size="10.5" fill="#a5adcb">вне протокола · только sitemap</text>

<!-- Подпись -->
<text x="525" y="462" text-anchor="middle" font-family="'JetBrains Mono', monospace"
      font-size="12" fill="#7dc4e4">Мишка на сервере · @jtprogru_channel</text>
</svg>
