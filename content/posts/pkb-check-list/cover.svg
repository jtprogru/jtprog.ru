<svg width="1050" height="480" viewBox="0 0 1050 480" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Чек-лист для организации персональной базы знаний</title>
<desc>Слева хаотичная россыпь несвязанных заметок, в центре воронка обработки с ситом вопросов «полезно? применимо?», справа сапфировый граф связанных знаний; обратная дуга ревью возвращает часть заметок обратно, ответвление уводит лишнее в удаление.</desc>
<defs>
<linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#24273a"/><stop offset="100%" stop-color="#1e2030"/>
</linearGradient>
<linearGradient id="exitGrad" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#0b7285"/><stop offset="100%" stop-color="#7dc4e4"/>
</linearGradient>
<marker id="arrowN" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L8,4 L0,8 z" fill="#494d64"/>
</marker>
<marker id="arrowA" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L8,4 L0,8 z" fill="#7dc4e4"/>
</marker>
</defs>

<!-- база: прямые края, весь холст -->
<rect x="0" y="0" width="1050" height="480" fill="url(#bgGrad)"/>

<!-- тихая структурная сетка -->
<g stroke="#494d64" stroke-width="0.5" opacity="0.3">
  <line x1="0" y1="112" x2="1050" y2="112"/>
  <line x1="380" y1="112" x2="380" y2="440"/>
  <line x1="655" y1="112" x2="655" y2="440"/>
</g>

<!-- Заголовок и тезис -->
<text x="525" y="56" text-anchor="middle" font-family="'PT Sans', sans-serif"
      font-size="27" font-weight="700" fill="#cad3f5">Чек-лист для организации персональной базы знаний</text>
<text x="525" y="88" text-anchor="middle" font-family="'PT Sans', sans-serif"
      font-size="14" fill="#a5adcb">заметки становятся знанием, только когда их обрабатывают и связывают</text>

<!-- метки зон -->
<g font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">
  <text x="200" y="134" fill="#a5adcb">данные</text>
  <text x="500" y="134" fill="#a5adcb">обработка</text>
  <text x="838" y="134" fill="#7dc4e4">знания</text>
</g>

<!-- ЛЕВО: хаотичная россыпь сырых заметок, без единой связи -->
<g fill="#363a4f" stroke="#494d64" stroke-width="1">
  <rect x="88" y="168" width="26" height="26" rx="4" transform="rotate(-9 101 181)"/>
  <rect x="142" y="152" width="20" height="20" rx="4" transform="rotate(12 152 162)" opacity="0.85"/>
  <rect x="196" y="176" width="30" height="30" rx="4" transform="rotate(6 211 191)"/>
  <rect x="254" y="154" width="24" height="24" rx="4" transform="rotate(-14 266 166)" opacity="0.8"/>
  <rect x="304" y="188" width="18" height="18" rx="4" transform="rotate(10 313 197)" opacity="0.75"/>
  <rect x="78" y="234" width="22" height="22" rx="4" transform="rotate(14 89 245)" opacity="0.8"/>
  <rect x="130" y="214" width="32" height="32" rx="4" transform="rotate(-6 146 230)"/>
  <rect x="190" y="248" width="20" height="20" rx="4" transform="rotate(8 200 258)" opacity="0.85"/>
  <rect x="242" y="216" width="26" height="26" rx="4" transform="rotate(-11 255 229)"/>
  <rect x="298" y="248" width="28" height="28" rx="4" transform="rotate(5 312 262)" opacity="0.9"/>
  <rect x="98" y="298" width="30" height="30" rx="4" transform="rotate(-7 113 313)" opacity="0.9"/>
  <rect x="158" y="310" width="18" height="18" rx="4" transform="rotate(13 167 319)" opacity="0.75"/>
  <rect x="208" y="292" width="24" height="24" rx="4" transform="rotate(-4 220 304)"/>
  <rect x="264" y="312" width="26" height="26" rx="4" transform="rotate(9 277 325)" opacity="0.85"/>
  <rect x="314" y="288" width="20" height="20" rx="4" transform="rotate(-12 324 298)" opacity="0.8"/>
</g>
<text x="200" y="378" text-anchor="middle" font-family="'PT Sans', sans-serif"
      font-size="13" fill="#a5adcb">всё подряд: заметки, скрины, ссылки</text>

<!-- поток в воронку -->
<line x1="352" y1="250" x2="392" y2="250" stroke="#494d64" stroke-width="1.8" marker-end="url(#arrowN)"/>

<!-- ЦЕНТР: воронка обработки, нейтральная -->
<polygon points="400,145 600,232 600,268 400,355" fill="#363a4f" fill-opacity="0.5"
         stroke="#494d64" stroke-width="1.5"/>
<g stroke="#494d64" stroke-width="1" stroke-dasharray="3 5" opacity="0.7">
  <line x1="460" y1="175" x2="460" y2="325"/>
  <line x1="505" y1="196" x2="505" y2="304"/>
  <line x1="550" y1="215" x2="550" y2="285"/>
</g>
<text x="500" y="378" text-anchor="middle" font-family="'PT Sans', sans-serif"
      font-size="13" fill="#a5adcb">полезно? применимо? нужно?</text>

<!-- СМЫСЛОВОЙ ЦЕНТР: выход из воронки в связанный граф -->
<g>
  <line x1="606" y1="250" x2="812" y2="249" stroke="#7dc4e4" stroke-width="6" opacity="0.14" stroke-linecap="round"/>
  <line x1="606" y1="250" x2="812" y2="249" stroke="url(#exitGrad)" stroke-width="2.2" marker-end="url(#arrowA)"/>
</g>

<!-- граф знаний: связи -->
<g stroke="#7dc4e4" fill="none" stroke-linecap="round">
  <g stroke-width="6" opacity="0.13">
    <line x1="838" y1="248" x2="735" y2="195"/>
    <line x1="838" y1="248" x2="852" y2="160"/>
    <line x1="838" y1="248" x2="955" y2="215"/>
    <line x1="838" y1="248" x2="930" y2="320"/>
    <line x1="838" y1="248" x2="790" y2="330"/>
    <line x1="735" y1="195" x2="852" y2="160"/>
    <line x1="955" y1="215" x2="930" y2="320"/>
  </g>
  <g stroke-width="2">
    <line x1="838" y1="248" x2="735" y2="195"/>
    <line x1="838" y1="248" x2="852" y2="160"/>
    <line x1="838" y1="248" x2="955" y2="215"/>
    <line x1="838" y1="248" x2="930" y2="320"/>
    <line x1="838" y1="248" x2="790" y2="330"/>
    <line x1="735" y1="195" x2="852" y2="160"/>
    <line x1="955" y1="215" x2="930" y2="320"/>
  </g>
</g>

<!-- граф знаний: узлы -->
<g fill="#363a4f" stroke="#7dc4e4">
  <circle cx="735" cy="195" r="12" stroke-width="1.8"/>
  <circle cx="852" cy="160" r="12" stroke-width="1.8"/>
  <circle cx="955" cy="215" r="12" stroke-width="1.8"/>
  <circle cx="930" cy="320" r="12" stroke-width="1.8"/>
  <circle cx="790" cy="330" r="12" stroke-width="1.8"/>
  <circle cx="838" cy="248" r="17" stroke-width="2.5"/>
</g>
<text x="880" y="378" text-anchor="middle" font-family="'PT Sans', sans-serif"
      font-size="13" fill="#a5adcb">связанные знания</text>

<!-- обратная дуга: систематическое ревью -->
<path d="M828,352 C788,412 666,406 578,292" fill="none" stroke="#494d64"
      stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrowN)"/>
<text x="626" y="334" text-anchor="middle" font-family="'JetBrains Mono', monospace"
      font-size="11" fill="#a5adcb">ревью</text>

<!-- ответвление: безжалостное удаление -->
<line x1="721" y1="389" x2="721" y2="414" stroke="#494d64" stroke-width="1.4"
      stroke-dasharray="3 4" marker-end="url(#arrowN)"/>
<text x="721" y="434" text-anchor="middle" font-family="'JetBrains Mono', monospace"
      font-size="10.5" fill="#a5adcb" opacity="0.75">удалить</text>

<!-- Подпись -->
<text x="525" y="463" text-anchor="middle" font-family="'JetBrains Mono', monospace"
      font-size="11.5" fill="#7dc4e4">Мишка на сервере · @jtprogru_channel</text>
</svg>
