<svg width="1050" height="480" viewBox="0 0 1050 480" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Скорость сгорания бюджета ошибок — что тут не так?</title>
<desc>Слева физическая скорость v = s / t со своей размерностью, знак «не равно», в центре светящаяся дробь burn rate, где одинаковые единицы в числителе и знаменателе сокращаются и остаётся чистый множитель 20×, справа — за сколько сгорает тридцатидневный бюджет при кратности 1×, 14.4× и 20×.</desc>
<defs>
<linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#24273a"/><stop offset="100%" stop-color="#1e2030"/>
</linearGradient>
<linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#2c3448"/><stop offset="100%" stop-color="#222839"/>
</linearGradient>
<linearGradient id="glowGrad" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#0b7285" stop-opacity="0"/>
<stop offset="50%" stop-color="#0b7285" stop-opacity="0.40"/>
<stop offset="100%" stop-color="#0b7285" stop-opacity="0"/>
</linearGradient>
<marker id="arrHead" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
<path d="M0,0 L7,3.5 L0,7 Z" fill="#7dc4e4"/>
</marker>
</defs>

<!-- база -->
<rect x="0" y="0" width="1050" height="480" fill="url(#bgGrad)"/>

<!-- тихая структурная сетка -->
<g stroke="#494d64" stroke-width="0.5" opacity="0.18">
  <line x1="75" y1="0" x2="75" y2="480"/>
  <line x1="150" y1="0" x2="150" y2="480"/>
  <line x1="225" y1="0" x2="225" y2="480"/>
  <line x1="300" y1="0" x2="300" y2="480"/>
  <line x1="375" y1="0" x2="375" y2="480"/>
  <line x1="450" y1="0" x2="450" y2="480"/>
  <line x1="525" y1="0" x2="525" y2="480"/>
  <line x1="600" y1="0" x2="600" y2="480"/>
  <line x1="675" y1="0" x2="675" y2="480"/>
  <line x1="750" y1="0" x2="750" y2="480"/>
  <line x1="825" y1="0" x2="825" y2="480"/>
  <line x1="900" y1="0" x2="900" y2="480"/>
  <line x1="975" y1="0" x2="975" y2="480"/>
</g>
<line x1="0" y1="110" x2="1050" y2="110" stroke="#494d64" stroke-width="0.5" opacity="0.4"/>

<!-- Заголовок -->
<text x="525" y="54" text-anchor="middle" font-family="'PT Sans', sans-serif"
      font-size="30" font-weight="700" fill="#cad3f5">Скорость сгорания бюджета ошибок — что тут не так?</text>
<text x="525" y="86" text-anchor="middle" font-family="'PT Sans', sans-serif"
      font-size="15" fill="#a5adcb">единицы измерения сокращаются, остаётся кратность</text>

<!-- заголовки колонок -->
<text x="210" y="136" text-anchor="middle" font-family="'JetBrains Mono', monospace"
      font-size="10.5" fill="#a5adcb">ложная аналогия</text>
<text x="470" y="136" text-anchor="middle" font-family="'JetBrains Mono', monospace"
      font-size="10.5" fill="#7dc4e4">burn rate</text>
<text x="768" y="136" text-anchor="middle" font-family="'JetBrains Mono', monospace"
      font-size="10.5" fill="#a5adcb">за сколько сгорает бюджет 30 дней</text>

<!-- левая карточка: физическая скорость -->
<rect x="130" y="206" width="160" height="112" rx="10" fill="#363a4f" stroke="#494d64" stroke-width="1"/>
<text x="210" y="236" text-anchor="middle" dominant-baseline="central" font-family="'PT Sans', sans-serif"
      font-size="15" fill="#cad3f5">скорость</text>
<text x="210" y="264" text-anchor="middle" dominant-baseline="central" font-family="'JetBrains Mono', monospace"
      font-size="14" fill="#a5adcb">v = s / t</text>
<text x="210" y="292" text-anchor="middle" dominant-baseline="central" font-family="'JetBrains Mono', monospace"
      font-size="10.5" fill="#a5adcb">км/ч · м/с</text>
<text x="210" y="338" text-anchor="middle" dominant-baseline="central" font-family="'JetBrains Mono', monospace"
      font-size="10" fill="#a5adcb">время в знаменателе</text>

<!-- знак неравенства -->
<text x="315" y="264" text-anchor="middle" dominant-baseline="central" font-family="'PT Sans', sans-serif"
      font-size="36" font-weight="700" fill="#a5adcb">≠</text>

<!-- СМЫСЛОВОЙ ЦЕНТР: сапфировый очаг -->
<rect x="336" y="154" width="268" height="224" fill="url(#glowGrad)"/>
<rect x="352" y="168" width="236" height="196" rx="10" fill="url(#cardGrad)" stroke="#7dc4e4" stroke-width="1.5"/>

<!-- дробь: числитель -->
<text x="470" y="196" text-anchor="middle" dominant-baseline="central" font-family="'JetBrains Mono', monospace"
      font-size="18" font-weight="700" fill="#7dc4e4">0.02</text>
<text x="470" y="215" text-anchor="middle" dominant-baseline="central" font-family="'JetBrains Mono', monospace"
      font-size="9.5" fill="#a5adcb">доля ошибок за интервал</text>
<line x1="382" y1="230" x2="558" y2="230" stroke="#7dc4e4" stroke-width="1.3"/>
<!-- знаменатель -->
<text x="470" y="248" text-anchor="middle" dominant-baseline="central" font-family="'JetBrains Mono', monospace"
      font-size="18" font-weight="700" fill="#7dc4e4">0.001</text>
<text x="470" y="267" text-anchor="middle" dominant-baseline="central" font-family="'JetBrains Mono', monospace"
      font-size="9.5" fill="#a5adcb">доля, допустимая по SLO</text>

<line x1="382" y1="288" x2="558" y2="288" stroke="#7dc4e4" stroke-width="0.8" opacity="0.35"/>

<!-- результат -->
<text x="470" y="318" text-anchor="middle" dominant-baseline="central" font-family="'JetBrains Mono', monospace"
      font-size="32" font-weight="700" fill="#7dc4e4">= 20×</text>
<text x="470" y="346" text-anchor="middle" dominant-baseline="central" font-family="'JetBrains Mono', monospace"
      font-size="9.5" fill="#a5adcb">размерности нет — только кратность</text>

<!-- стрелка центр -> практика -->
<line x1="594" y1="266" x2="616" y2="266" stroke="#7dc4e4" stroke-width="1.5" marker-end="url(#arrHead)"/>

<!-- правая колонка: срок жизни бюджета -->
<g>
  <text x="666" y="200" text-anchor="end" dominant-baseline="central" font-family="'JetBrains Mono', monospace"
        font-size="14" font-weight="700" fill="#7dc4e4">1×</text>
  <rect x="676" y="192" width="240" height="16" rx="5" fill="#363a4f" stroke="#494d64" stroke-width="1"/>
  <rect x="676" y="192" width="240" height="16" rx="5" fill="#6e738d"/>
  <text x="676" y="226" dominant-baseline="central" font-family="'JetBrains Mono', monospace"
        font-size="10" fill="#a5adcb">30 дней · ровно по плану</text>
</g>

<g>
  <text x="666" y="270" text-anchor="end" dominant-baseline="central" font-family="'JetBrains Mono', monospace"
        font-size="14" font-weight="700" fill="#7dc4e4">14.4×</text>
  <rect x="676" y="262" width="240" height="16" rx="5" fill="#363a4f" stroke="#494d64" stroke-width="1"/>
  <rect x="676" y="262" width="17" height="16" rx="5" fill="#6e738d"/>
  <text x="676" y="296" dominant-baseline="central" font-family="'JetBrains Mono', monospace"
        font-size="10" fill="#a5adcb">2 дня · 30 / 14.4 ≈ 2.08</text>
</g>

<g>
  <text x="666" y="340" text-anchor="end" dominant-baseline="central" font-family="'JetBrains Mono', monospace"
        font-size="14" font-weight="700" fill="#7dc4e4">20×</text>
  <rect x="676" y="332" width="240" height="16" rx="5" fill="#363a4f" stroke="#494d64" stroke-width="1"/>
  <rect x="676" y="332" width="12" height="16" rx="5" fill="#6e738d"/>
  <text x="676" y="366" dominant-baseline="central" font-family="'JetBrains Mono', monospace"
        font-size="10" fill="#a5adcb">1.5 дня · 30 / 20</text>
</g>

<!-- Подпись -->
<text x="525" y="462" text-anchor="middle" font-family="'JetBrains Mono', monospace"
      font-size="12" fill="#7dc4e4">Мишка на сервере · @jtprogru_channel</text>
</svg>
