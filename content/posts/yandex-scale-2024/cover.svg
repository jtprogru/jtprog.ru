<svg width="1050" height="480" viewBox="0 0 1050 480" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Yandex Scale 2024</title>
<desc>Четыре доклада односторонними стрелками уходят со сцены к слушателю, а справа светится единственный двусторонний канал — разговор с архитектором.</desc>
<defs>
