<text x="260" y="412" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a5adcb" opacity="0.75">одностороннее вещание</text>

<circle cx="600" cy="269" r="44" fill="#363a4f" stroke="#494d64" stroke-width="1"/>
<text x="600" y="269" text-anchor="middle" dominant-baseline="central" font-family="'PT Sans', sans-serif" font-size="22" font-weight="700" fill="#cad3f5">я</text>

<line x1="656" y1="269" x2="788" y2="269" stroke="#7dc4e4" stroke-width="3" marker-end="url(#arrS)" marker-start="url(#arrSback)"/>
<text x="722" y="246" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#7dc4e4">вопросы напрямую</text>

<rect x="798" y="239" width="122" height="60" rx="12" fill="url(#coreGrad)" stroke="#7dc4e4" stroke-width="1.5"/>
