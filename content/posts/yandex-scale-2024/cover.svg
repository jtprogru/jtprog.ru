<line x1="0" y1="118" x2="1050" y2="118"/>
<line x1="0" y1="190" x2="1050" y2="190"/>
<line x1="0" y1="269" x2="1050" y2="269"/>
<line x1="0" y1="348" x2="1050" y2="348"/>
<line x1="0" y1="420" x2="1050" y2="420"/>
</g>

<circle cx="736" cy="269" r="152" fill="url(#spark)"/>

<text x="140" y="140" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a5adcb" opacity="0.85">сцена</text>

<g fill="#363a4f" stroke="#494d64" stroke-width="1">
<rect x="140" y="152" width="240" height="48" rx="10"/>
<rect x="140" y="214" width="240" height="48" rx="10"/>
