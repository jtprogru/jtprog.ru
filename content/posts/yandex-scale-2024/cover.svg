<rect x="140" y="338" width="240" height="48" rx="10"/>
</g>
<g font-family="'JetBrains Mono', monospace" font-size="13" fill="#cad3f5" text-anchor="middle" dominant-baseline="central">
<text x="260" y="176">Yandex BareMetal</text>
<text x="260" y="238">chaos engineering</text>
<text x="260" y="300">S3 без интернета</text>
