<stop offset="0%" stop-color="#24273a"/><stop offset="100%" stop-color="#1e2030"/>
</linearGradient>
<radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
<stop offset="0%" stop-color="#7dc4e4" stop-opacity="0.26"/>
<stop offset="55%" stop-color="#7dc4e4" stop-opacity="0.08"/>
<stop offset="100%" stop-color="#7dc4e4" stop-opacity="0"/>
</radialGradient>
