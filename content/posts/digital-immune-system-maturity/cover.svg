<svg width="1050" height="480" viewBox="0 0 1050 480" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Digital Immune System: инженерия устойчивости как продукт</title>
<desc>Слева шесть тусклых квадратов практик Gartner, справа замкнутая петля SLO-gate-релиз-observability-инцидент-разбор с сапфировой дугой обучения: иммунитет рождается, когда цикл замыкается.</desc>
<defs>
<linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#24273a"/><stop offset="100%" stop-color="#1e2030"/>
</linearGradient>
<linearGradient id="arcGrad" x1="0" y1="1" x2="1" y2="0">
<stop offset="0%" stop-color="#0b7285"/><stop offset="100%" stop-color="#7dc4e4"/>
</linearGradient>
<marker id="arrowN" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L8,4 L0,8 z" fill="#494d64"/>
</marker>
<marker id="arrowA" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L8,4 L0,8 z" fill="#7dc4e4"/>
</marker>
</defs>

<!-- база: прямые края, весь холст -->
<rect x="0" y="0" width="1050" height="480" fill="url(#bgGrad)"/>

<!-- тихая структурная сетка -->
<g stroke="#494d64" stroke-width="0.5" opacity="0.3">
  <line x1="0" y1="112" x2="1050" y2="112"/>
  <line x1="0" y1="428" x2="1050" y2="428"/>
  <line x1="470" y1="112" x2="470" y2="428"/>
</g>

<!-- Заголовок и тезис -->
<text x="525" y="56" text-anchor="middle" font-family="'PT Sans', sans-serif"
      font-size="27" font-weight="700" fill="#cad3f5">Digital Immune System: инженерия устойчивости как продукт</text>
<text x="525" y="88" text-anchor="middle" font-family="'PT Sans', sans-serif"
      font-size="14" fill="#a5adcb">иммунитет — это не шесть практик, а петля, которая учится на инцидентах</text>

<!-- ЛЕВО: шесть практик Gartner, статичная сетка -->
<g opacity="0.9">
  <g font-family="'JetBrains Mono', monospace" font-size="10" fill="#a5adcb" text-anchor="middle">
    <rect x="140" y="176" width="64" height="64" rx="8" fill="#363a4f" stroke="#494d64"/>
    <text x="172" y="208" dominant-baseline="central">obs</text>
    <rect x="218" y="176" width="64" height="64" rx="8" fill="#363a4f" stroke="#494d64"/>
    <text x="250" y="208" dominant-baseline="central">AI-test</text>
    <rect x="296" y="176" width="64" height="64" rx="8" fill="#363a4f" stroke="#494d64"/>
    <text x="328" y="208" dominant-baseline="central">chaos</text>
    <rect x="140" y="254" width="64" height="64" rx="8" fill="#363a4f" stroke="#494d64"/>
    <text x="172" y="286" dominant-baseline="central">remed</text>
    <rect x="218" y="254" width="64" height="64" rx="8" fill="#363a4f" stroke="#494d64"/>
    <text x="250" y="286" dominant-baseline="central">SRE</text>
    <rect x="296" y="254" width="64" height="64" rx="8" fill="#363a4f" stroke="#494d64"/>
    <text x="328" y="286" dominant-baseline="central">supply</text>
  </g>
  <text x="250" y="356" text-anchor="middle" font-family="'PT Sans', sans-serif"
        font-size="13" fill="#a5adcb">шесть практик из презентации</text>
</g>

<!-- ЦЕНТР: не равно -->
<text x="455" y="262" text-anchor="middle" dominant-baseline="central"
      font-family="'PT Sans', sans-serif" font-size="42" fill="#a5adcb" opacity="0.7">&#8800;</text>

<!-- ПРАВО: замкнутая петля -->
<!-- нейтральные дуги по часовой -->
<g fill="none" stroke="#494d64" stroke-width="1.8">
  <path d="M727.8,158.4 A115,115 0 0 1 782.7,190.1" marker-end="url(#arrowN)"/>
  <path d="M810.5,238.3 A115,115 0 0 1 810.5,301.7" marker-end="url(#arrowN)"/>
  <path d="M782.7,349.9 A115,115 0 0 1 727.8,381.6" marker-end="url(#arrowN)"/>
  <path d="M672.2,381.6 A115,115 0 0 1 617.3,349.9" marker-end="url(#arrowN)"/>
  <path d="M589.5,301.7 A115,115 0 0 1 589.5,238.3" marker-end="url(#arrowN)"/>
</g>

<!-- СМЫСЛОВОЙ ЦЕНТР: сапфировая дуга «разбор → SLO», петля замыкается -->
<g fill="none">
  <path d="M617.3,190.1 A115,115 0 0 1 672.2,158.4" stroke="#7dc4e4" stroke-width="7" opacity="0.16" stroke-linecap="round"/>
  <path d="M617.3,190.1 A115,115 0 0 1 672.2,158.4" stroke="#7dc4e4" stroke-width="4" opacity="0.32" stroke-linecap="round"/>
  <path d="M617.3,190.1 A115,115 0 0 1 672.2,158.4" stroke="url(#arcGrad)" stroke-width="2.2" marker-end="url(#arrowA)"/>
</g>
<text x="560" y="152" text-anchor="end" font-family="'JetBrains Mono', monospace"
      font-size="11" fill="#7dc4e4">правила меняются</text>

<!-- узлы петли -->
<g font-family="'JetBrains Mono', monospace" font-size="10.5" text-anchor="middle">
  <rect x="676" y="144" width="48" height="22" rx="11" fill="#363a4f" stroke="#7dc4e4"/>
  <text x="700" y="155" dominant-baseline="central" fill="#cad3f5">SLO</text>

  <rect x="774" y="201" width="52" height="22" rx="11" fill="#363a4f" stroke="#494d64"/>
  <text x="800" y="212" dominant-baseline="central" fill="#a5adcb">gate</text>

  <rect x="771" y="316" width="58" height="22" rx="11" fill="#363a4f" stroke="#494d64"/>
  <text x="800" y="327" dominant-baseline="central" fill="#a5adcb">релиз</text>

  <rect x="676" y="374" width="48" height="22" rx="11" fill="#363a4f" stroke="#494d64"/>
  <text x="700" y="385" dominant-baseline="central" fill="#a5adcb">obs</text>

  <rect x="564" y="316" width="73" height="22" rx="11" fill="#363a4f" stroke="#494d64"/>
  <text x="600" y="327" dominant-baseline="central" fill="#a5adcb">инцидент</text>

  <rect x="570" y="201" width="61" height="22" rx="11" fill="#363a4f" stroke="#7dc4e4"/>
  <text x="600" y="212" dominant-baseline="central" fill="#7dc4e4">разбор</text>
</g>

<!-- центр кольца -->
<text x="700" y="263" text-anchor="middle" font-family="'PT Sans', sans-serif"
      font-size="13" fill="#a5adcb">петля</text>
<text x="700" y="281" text-anchor="middle" font-family="'PT Sans', sans-serif"
      font-size="13" fill="#a5adcb">обучения</text>

<!-- Подпись -->
<text x="525" y="460" text-anchor="middle" font-family="'JetBrains Mono', monospace"
      font-size="11.5" fill="#7dc4e4">Мишка на сервере · @jtprogru_channel</text>
</svg>
