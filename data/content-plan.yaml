  thesis:
  source: "content/posts/what-happens-when-you-open-website/index.md"
  status: idea
  date:
  note: "Второе углубление того же лонгрида. Темп по плану — одна статья в 4–6 недель, не чаще."

- id: habr-server-side
  kind: habr
  topic: "Что происходит на стороне сервера, пока браузер ждёт ответ"
  thesis:
  source: "content/posts/what-happens-when-you-open-website/index.md"
  status: idea
  date:
  note: "Третье углубление. Ставить в очередь только если первые два дали закладки."

