# Контент-план блога и канала. Живёт в репозитории, а не в SaaS: версионируется,
# диффается, правится тем же способом, что и посты.
#
# Поля:
#   id       — короткий стабильный идентификатор, по нему ссылаемся в обсуждениях
#   kind     — post (блог) | habr | channel | tool (инструмент + пост про него)
#   topic    — о чём, одной строкой
#   thesis   — утверждение, с которым можно не согласиться. Из него потом пишется
#              анонс (см. plans/blog-track-content-plan-v2.1.md, раздел 6).
#              Нет тезиса — нечего анонсировать, значит материал ещё не готов.
#   source   — откуда взялось: пост блога, лист The Way of SRE, инцидент, вопрос
#   status   — idea | next | drafting | review | published | dropped
#   date     — дата публикации; у idea пусто, заполняется при постановке в очередь
#   note     — оговорки и зависимости
#
# Очередь опросов и разборов по листьям The Way of SRE здесь не дублируется:
# по плану v2.1 (Приложение Г) она живёт в самом репозитории The Way of SRE
# как frontmatter-поле poll: true у листа.

- id: habr-dns-resolve
  kind: habr
  topic: "Резолвинг имени и путь запроса до сервера — с той детализацией, которая в обзорный лонгрид не влезла"
  thesis: "«Браузер спросил DNS» — это не один шаг, а пять уровней кеша, каждый из которых умеет соврать"
  source: "content/posts/what-happens-when-you-open-website/index.md"
  status: next
  date:
  note: >-
    Первая статья по схеме 1.6. Хабы: Системное администрирование, IT-инфраструктура,
    Сетевые технологии — единственное направление с подтверждённым попаданием
    (см. plans/habr-baseline-2026-08-19.md). Канал — в профиле, не в тексте.

