  thesis: "Пост 2019 года с командами под CentOS 7 — не архив, а действующая дезинформация"
  source: "plans/posts-refresh-plan.md"
  status: idea
  date:
  note: >-
    Ноль работы поверх текущего пайплайна актуализации: обновление и так делается,
    не хватало только публиковать сам факт. Требует refresh-banner в обновлённом
    посте — на него ссылается анонс.

