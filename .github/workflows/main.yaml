---
name: CI
'on':
  push:
    branches:
      - "main"
  workflow_dispatch:

env:
  # Версия, на которой собирался прод в jtprogru/hugo-rsync-deployment.
  HUGO_VERSION: '0.161.1'

jobs:
  deploy-website:
    runs-on: ubuntu-latest
    steps:
      - name: Do a git checkout including submodules
        uses: actions/checkout@master
        with:
          submodules: true
          fetch-depth: 0 # нужна история коммитов для git diff в IndexNow-шаге

      # Раньше Hugo ставил внутри себя deploy-экшен, и флаги сборки жили в его
      # inputs. Теперь сборка описана в Makefile (make build-prod), поэтому
      # локально и в CI собирается буквально одна и та же команда, а здесь
      # остаётся только положить нужный бинарник.
      - name: Install Hugo
        run: |
          set -euo pipefail
          asset="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          tmp="$(mktemp -d)"
          curl -fsSL "${base}/${asset}" -o "${tmp}/${asset}"
          curl -fsSL "${base}/hugo_${HUGO_VERSION}_checksums.txt" \
            -o "${tmp}/checksums.txt"
          (cd "${tmp}" && grep " ${asset}\$" checksums.txt | sha256sum -c -)
          tar xf "${tmp}/${asset}" -C "${tmp}" hugo
          sudo install -m 0755 "${tmp}/hugo" /usr/local/bin/hugo
          rm -rf "${tmp}"
          hugo version

      # Блок без пререндера уезжает на runtime-ветку render hook'а: mermaid с
      # CDN и цвета, которых никто не видел до публикации. Ровно так уехала
      # схема в digital-immune-system-maturity.
      - name: Verify mermaid diagrams are pre-rendered
        run: make mermaid-check

      - name: Stamp commit hash into the config
        env:
          CI: 'true'
        run: make stamp-commit

      - name: Build site
        run: make build-prod

      - name: Copy robots.txt into the built site
        run: make robots

      - name: Deploy to VPS
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_DEST: ${{ secrets.DEPLOY_TARGET_PATH }}
        run: |
          set -euo pipefail
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${DEPLOY_SSH_KEY}" > "${HOME}/.ssh/id_rsa_deploy"
          chmod 600 "${HOME}/.ssh/id_rsa_deploy"
          # Часть shared-хостингов (fail2ban, троттлинг) молча роняет keyscan.
          # Пустой known_hosts не должен ломать деплой — ниже accept-new.
          ssh-keyscan -T 10 "${DEPLOY_HOST}" \
            > "${HOME}/.ssh/known_hosts" 2>/dev/null || true
          if [ ! -s "${HOME}/.ssh/known_hosts" ]; then
            echo "WARN: ssh-keyscan не отдал ключ для ${DEPLOY_HOST}," \
                 "полагаемся на StrictHostKeyChecking=accept-new"
          fi
          make deploy

      - name: Ping Yandex Webmaster sitemap
        if: ${{ success() }}
        run: curl -s
          "https://webmaster.yandex.ru/ping?sitemap=https://jtprog.ru/sitemap.xml"

      # Уведомляет участников IndexNow (Bing, Yandex, Seznam, Naver…) о реально
      # изменившихся страницах. Google в IndexNow не входит. Ключ публичный,
      # его файл лежит в static/<KEY>.txt → https://jtprog.ru/<KEY>.txt.
      - name: Compute changed URLs for IndexNow
        id: indexnow-urls
        if: ${{ success() }}
        env:
          INDEXNOW_KEY: f5059cf9a4a60e4b769ca074324beb1b
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: bash scripts/indexnow.sh

      - name: Submit changed pages to IndexNow
        if: ${{ success() && steps.indexnow-urls.outputs.count != '0' && steps.indexnow-urls.outputs.count != '' }}
        # main @ 2026-06-02 (docs(changelog): cut v0.5.0)
        uses: jtprogru/indexnow@da0ce6b0e524a9293f075bbf4dfe961b662eaa10
        with:
          key: f5059cf9a4a60e4b769ca074324beb1b
          file: ${{ steps.indexnow-urls.outputs.urls-file }}
          host: jtprog.ru
          fail-on: never

      - name: Telegram Notify
        if: always()
        uses: jtprogru/notiflow@v1.6.1
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id:   ${{ secrets.TELEGRAM_USER_ID }}
          status:    ${{ job.status }}
          message_template: |
            *Deploy status*: {{.StatusEmoji}}
            *Project*: `{{.Repo}}`
            *Runs on*: {{.ServerUrl}}/{{.Repo}}/tree/{{.Sha}}
            *Branch*: `{{.Ref}}`
